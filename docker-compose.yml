services:
  bot-backend:
    build: .
    init: true
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:18080:8000"
    volumes:
      - ./data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  scheduler:
    build: .
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      BACKEND_INTERNAL_URL: http://bot-backend:8000
    depends_on:
      - bot-backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    command: ["python", "-m", "app.scheduler"]
